name: semantic_zoom
description: >-
  Pinch or tap to stretch text from a brief title to full notes: an animated
  read more and StretchText for Flutter, with rich text and LLM helpers.
version: 0.2.0
homepage: https://roshendz.github.io/semantic_zoom/
repository: https://github.com/Roshendz/semantic_zoom
issue_tracker: https://github.com/Roshendz/semantic_zoom/issues
screenshots:
  - description: Pinching a travel journal from highlights to full entries, then tapping one day
    path: doc/demo.gif
topics:
  - text
  - animation
  - gestures
  - accessibility
  - list

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  characters: ^1.3.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
