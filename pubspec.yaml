name: semantic_zoom
description: >-
  Pinch or tap to stretch text from a brief title to full notes. StretchText /
  telescopic text for Flutter lists: words slide and morph, not scale.
version: 0.1.0
homepage: https://roshendz.github.io/semantic_zoom/
repository: https://github.com/Roshendz/semantic_zoom
issue_tracker: https://github.com/Roshendz/semantic_zoom/issues
topics:
  - text
  - animation
  - gestures
  - accessibility
  - list

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
